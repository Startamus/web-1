version: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres13:/var/lib/postgresql/data
  web:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    command: bundle exec rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
    depends_on:
      - postgres
    environment:
      PG_HOST: postgres
  test:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    command: bundle exec rake test
    volumes:
      - .:/rails
    depends_on:
      - postgres
    environment:
      RAILS_ENV: test
      PG_HOST: postgres
volumes:
  postgres13:
